name: Claude History Review

# 歴史上の事実の裏どりを担う三本目。
# 共有の雛形（fermentary の tools/gh-review/）はワークフローを二本しか配らないので、このファイルはこのリポジトリ固有である。
# 雛形からの逸脱ではなく、雛形が扱っていない領域の追加に当たる。
# 別レーンに分けた理由・Web 検索を許した理由・ランタイムを入れない理由は docs/adr/0035-history-review-lane.md が持つ。

# issues トリガを持たないのは claude.yml と同じ理由。
# issue 本文は仕様書で、そこに手順として起動語を書くと言及と起動を文字列で区別できない。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  historian:
    # 起動語は `@historian` で、`@claude` を部分文字列として含まない。
    # 含む語（`@claude-history` など）にすると claude.yml の if:（contains(body, '@claude')）にも当たり、
    # 一つのコメントで二本が走って API 利用料と Actions 分が二重に燃える。
    # 起動語を変えるときは claude.yml の if: を必ず一緒に見る。
    #
    # 絞りの形は claude.yml と同じで、理由もそちらのコメントが持つ。
    # 要点は三つ。
    # 公開後は誰でもコメントできるので招かれた人だけに絞ること、経路ごとに association の載っているオブジェクトが違うこと、
    # この if: を job 側に置くこと（ステップに置くとコンテナが起動して Actions 分を消費する）。
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@historian') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@historian') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@historian') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # claude.yml とは別のグループにする。
      # 同じにすると、コードのレビューが走っている間その PR の裏どりが待たされる。
      # 二本は同じファイルを読むだけで書かないので、並走しても競合しない。
      group: historian-${{ github.event.issue.number || github.event.pull_request.number }}
      # 走っている応答を途中で止めると中途半端なコメントが残るので cancel はしない。
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # mise・pnpm・Playwright のインストールを持たない（claude.yml と check.yml はどれも持つ）。
      # 歴史の誤りは pnpm check では赤くならず、permissions が contents: read なので直すこともできない。
      # 回した結果が指摘の材料にならないので、Playwright のブラウザ 356MB を含むインストールがそのまま無駄になる。

      # claude-code-action の native installer は ~/.local/bin が無いと
      # 「missing or broken」と警告しつつ実体を置かないまま success 扱いになり、
      # 後続のアクション実行が ENOENT で落ちる（claude.yml で実測）。
      # ubuntu-latest ランナーにこのディレクトリは既定で無いので、先に作っておく。
      - run: mkdir -p "$HOME/.local/bin"

      - name: Run Claude Code
        id: historian
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # 既定は `@claude` なので、明示して claude.yml と別の語にする。
          # 上の if: と同じ語でなければ、job は起動するのにアクションが自主的に降りて success で終わる。
          trigger_phrase: "@historian"

          # prompt は空のままにする。
          # 空なら起動したコメントの本文がそのまま依頼になり、「この 6 件の年代を見て」のように範囲を絞って呼べる。
          # 役割と方法は下の system prompt が固定する。

          # WebSearch と WebFetch がこのレーンの本体である。
          # 外部の典拠を参照しない第二の意見は、一次と同じ種類の誤りを二重に確認した外形付きで返す（ADR-0035）。
          # 差分を読む gh と git は読み取りだけを名指しする。
          # Read・Grep・Glob を名指しするのは、非対話モードでは allowedTools に無いツールが拒否されるためで、
          # 名指しを落とすと catalog/ の JSON を開けないまま推測で書き始める。
          # 言語・文体の指定は prompt でなく system prompt へ置く（既存二本と同じ理由。prompt の中身は
          # スラッシュコマンドの引数として解釈されうるので、指示が届く保証が無い）。
          claude_args: '--allowedTools "WebSearch,WebFetch,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)" --append-system-prompt "あなたが担うのは歴史上の事実の裏どりだけである。コードの品質・設計・実装は見ない（それは @claude と自動レビューの担当）。見るのは catalog/series.json と catalog/loci.geojson の 5 つ——timeRange・代表点の座標・region・kind・title。データモデルの説明は docs/ARCHITECTURE.md §3 にあるので先に読む。loci.geojson の coordinates は GeoJSON なので [経度, 緯度] の順である。緯度経度の順と読み違えない。記憶だけで断定せず、指摘には WebSearch か WebFetch で取った典拠の URL を必ず付ける。典拠が割れているとき（伝承・推定年代・実在が定説でない人物）は、どちらか一方に決めず、割れていること自体を書く。黙って省くと確認して問題無しだったのか確認していないのかを読み手が区別できないので、確認できなかった項目は確認できなかったと明示する。断定と推測を混ぜず、推測の箇所は推測だと書く。出力はすべて日本語で、文体は だ・である調。識別子・パス・座標・年は原文のまま残す。指摘ごとに現在の値・典拠が示す値・典拠の URL の三つを並べる。指摘が無い項目についても、何を確認して問題無しと判断したかを残す。permissions が contents: read でファイルは書けないので、修正は提案までにする。サブエージェントは run_in_background を使わず、同じターンで結果を待って起動する。非対話で走るので完了通知が届かず、待つ形にすると結果を受け取れないまま終わる。"'
