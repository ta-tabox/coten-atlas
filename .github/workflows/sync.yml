name: Sync feed

# 配信フィードを同期し、catalog/series.json にシリーズが無い season のシーズン調査の issue を起票する。
# 起票する題と本文は web/ の pnpm sync が決め、このワークフローは既存の issue の題を渡して、書き出された 1 件ずつを起票するだけにする。

on:
  schedule:
    # 月曜と木曜の 12:17 UTC（21:17 JST）。
    # 番組は月曜と木曜の 06:00 JST に配信するので、同じ日の夜に走らせて新しい回を拾う。
    # 毎時 0 分は定期実行が集中して起動が遅れるので、分をずらす。
    - cron: "17 12 * * 1,4"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 前の run が起票し終える前に次の run が既存の issue の題を読むと、同じ season を二度起票する。
    concurrency:
      group: sync
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write

    # アプリは web/ の中。uses: のアクションには working-directory が効かないので、run: のステップだけを web/ で回す。
    defaults:
      run:
        working-directory: web

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ランタイムの版はルートの mise.toml が持つ。
      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      # 閉じた issue も渡す。
      # 開いた issue だけと比べると、調査を終えて閉じた season へ同じ issue を二度起票する。
      # gh issue list は既定で 30 件しか返さないので、--limit で全件を取る。
      - name: List existing survey issues
        run: |
          gh issue list --state all --search "シーズン調査: in:title" --limit 1000 \
            --json title --jq '[.[].title]' > "$RUNNER_TEMP/issue-titles.json"

      - name: Sync feed
        run: |
          pnpm sync --issue-titles "$RUNNER_TEMP/issue-titles.json" --survey-issues "$RUNNER_TEMP/survey-issues.json"
          jq -r '.[].title' "$RUNNER_TEMP/survey-issues.json"

      - name: Create survey issues
        run: |
          count=$(jq length "$RUNNER_TEMP/survey-issues.json")
          for index in $(seq 0 $((count - 1))); do
            jq -r ".[$index].body" "$RUNNER_TEMP/survey-issues.json" > "$RUNNER_TEMP/survey-issue-body.md"
            gh issue create \
              --title "$(jq -r ".[$index].title" "$RUNNER_TEMP/survey-issues.json")" \
              --body-file "$RUNNER_TEMP/survey-issue-body.md" \
              --label tooling \
              --label claude
          done
