name: Sync feed

# 配信フィードを同期し、catalog/episodes.json が変わったら PR を開いて Check を起動し、catalog/series.json にシリーズが無い season のシーズン調査の issue を起票する。
# episodes.json の中身と、起票する題と本文は web/ の pnpm sync が決め、このワークフローは書き出された結果をコミットと起票へ渡すだけにする。

on:
  schedule:
    # 月曜と木曜の 12:17 UTC（21:17 JST）。
    # 番組は月曜と木曜の 06:00 JST に配信するので、同じ日の夜に走らせて新しい回を拾う。
    # 毎時 0 分は定期実行が集中して起動が遅れるので、分をずらす。
    - cron: "17 12 * * 1,4"
  workflow_dispatch:

env:
  # 同期の結果を載せるブランチ。
  # run ごとに main から作り直して force push するので、開いた PR は 1 本のまま最新の同期の結果に置き換わる。
  SYNC_BRANCH: sync/episodes

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 前の run が起票し終える前に次の run が既存の issue の題を読むと、同じ season を二度起票する。
    concurrency:
      group: sync
      cancel-in-progress: false
    outputs:
      episodes-changed: ${{ steps.episodes.outputs.changed }}
    # contents: write は同期のブランチへの push、pull-requests: write は PR の作成、issues: write は起票に要る。
    permissions:
      contents: write
      pull-requests: write
      issues: write

    # アプリは web/ の中。uses: のアクションには working-directory が効かないので、run: のステップだけを web/ で回す。
    # shell: bash を名指すと pipefail が付き、pnpm sync を tee へ繋いでも pnpm sync の失敗でステップが止まる。
    defaults:
      run:
        working-directory: web
        shell: bash

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ランタイムの版はルートの mise.toml が持つ。
      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      # 閉じた issue も渡す。
      # 開いた issue だけと比べると、調査を終えて閉じた season へ同じ issue を二度起票する。
      # --search は検索の索引を通り、直前の run が起票した issue が索引へ反映される前だと見落とすので、一覧から全件を取る。
      # gh issue list は既定で 30 件しか返さないので、--limit で全件を取る。
      - name: List existing issue titles
        run: |
          gh issue list --state all --limit 1000 \
            --json title --jq '[.[].title]' > "$RUNNER_TEMP/issue-titles.json"

      # 同期のサマリと警告は PR の本文に載せるので、ファイルにも残す。
      - name: Sync feed
        run: |
          pnpm sync --existing-issue-titles "$RUNNER_TEMP/issue-titles.json" --survey-issues-out "$RUNNER_TEMP/survey-issues.json" \
            2>&1 | tee "$RUNNER_TEMP/sync-summary.txt"
          jq -r '.[].title' "$RUNNER_TEMP/survey-issues.json"

      - name: Create survey issues
        run: |
          count=$(jq length "$RUNNER_TEMP/survey-issues.json")
          for index in $(seq 0 $((count - 1))); do
            jq -r ".[$index].body" "$RUNNER_TEMP/survey-issues.json" > "$RUNNER_TEMP/survey-issue-body.md"
            gh issue create \
              --title "$(jq -r ".[$index].title" "$RUNNER_TEMP/survey-issues.json")" \
              --body-file "$RUNNER_TEMP/survey-issue-body.md" \
              --label tooling \
              --label claude
          done

      # syncedAt は同期のたびに変わるので、syncedAt を除いた中身で main と比べる。
      - name: Detect episodes change
        id: episodes
        run: |
          if diff <(git show HEAD:catalog/episodes.json | jq 'del(.syncedAt)') <(jq 'del(.syncedAt)' ../catalog/episodes.json) > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open sync pull request
        if: steps.episodes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          git add ../catalog/episodes.json
          git commit -m "chore(catalog): 配信フィードの同期で episodes.json を更新する"
          git push --force origin "$SYNC_BRANCH"

          {
            echo "定期実行の同期（\`.github/workflows/sync.yml\`）が \`catalog/episodes.json\` を更新した。"
            echo "この PR は \`GITHUB_TOKEN\` で開いたので、\`check.yml\` は同期の run が \`workflow_dispatch\` で起動する。"
            echo "Check の結果はこの PR の Checks 欄に出る。"
            echo
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## 同期のサマリ"
            echo
            echo '```'
            cat "$RUNNER_TEMP/sync-summary.txt"
            echo '```'
          } > "$RUNNER_TEMP/sync-pr-body.md"

          open_pr=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$open_pr" ]; then
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "配信フィードの同期で episodes.json を更新する" \
              --body-file "$RUNNER_TEMP/sync-pr-body.md"
          else
            gh pr edit "$open_pr" --body-file "$RUNNER_TEMP/sync-pr-body.md"
          fi

  # GITHUB_TOKEN で開いた PR や push では check.yml の pull_request が起動しないので、workflow_dispatch で同期のブランチに対して起動する。
  # actions: write は他のワークフローの起動と run の削除もできる権限なので、依存のコードを走らせる sync の job には持たせず、gh を 1 回呼ぶだけのこの job に閉じる。
  check-sync-pr:
    needs: sync
    if: needs.sync.outputs.episodes-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch Check on the sync branch
        run: gh workflow run check.yml --ref "$SYNC_BRANCH"
