name: Check

# 中身が言語とタスクランナーに依存するので、共有の雛形は無く、このリポジトリで書き下ろす。
# 実行環境は claude.yml と同一にする（レビューする側がビルドもテストも回せないと指摘が机上になる）。

on:
  pull_request:
  push:
    branches: [main]
  # 手動の起動で、選んだブランチの版の check.yml が走り、結果はそのブランチの head のコミットに付く。
  # sync.yml が GITHUB_TOKEN で開いた同期の PR には pull_request が起動しないので、sync.yml の job check-sync-pr がこの起動で同期のブランチを検査する。
  # 人が起動するときは、Actions タブの「Check」の「Run workflow」か、gh workflow run check.yml --ref <ブランチ> を使い、起動できるのは書き込み権限を持つ人だけである。
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR は連続 push で古い run を捨てる（cancel-in-progress: true）。
    # main は捨てると直近の commit が緑を持たなくなるので false。
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    # アプリは web/ の中。run: のステップだけを web/ で回す。
    # uses: のアクション（checkout / mise-action）には working-directory が効かないので、
    # mise-action はリポジトリのルートに居たまま、ルートの mise.toml を読む。
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ランタイムは mise で入れる（toolchain.md）。版はルートの mise.toml が持つ。CI に書き下ろさない。
      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      # L4 のスモークがヘッドレスの Chromium を立てる。
      # 回すのは Playwright で、CLI は @playwright/test が持つ。
      # バイナリは 356MB あるので、pnpm-lock.yaml が動くまでは取り直さない。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      # キャッシュが当たればダウンロードは playwright 自身が飛ばす。
      # --with-deps の側は毎回要る（システムライブラリはキャッシュに載らない）。
      - run: pnpm exec playwright install --with-deps chromium

      # 判定の口はこの一本。型 / 静的 / ユニット / ビルド / スモークをまとめて回す。
      - run: pnpm check
