name: Deploy

# main の内容を GitHub Pages へ配信する（docs/adr/0007-github-pages.md）。
# 品質の判定は持たない（型・静的・テストは check.yml の pnpm check が見る）。
# 配信の後にしか分からないので、配れたものへ到達できるかだけは deploy ジョブの後段が見る（docs/adr/0036-post-deploy-reachability.md）。
# ランタイムの立て方は check.yml と揃える（食い違うと、check が緑の commit で配信だけが落ちる）。

on:
  push:
    branches: [main]
  workflow_dispatch:

# ここで配るのは全ジョブに渡る分なので、checkout の読み取りに要る contents: read だけに絞る。
# Pages の書き込みと OIDC は deploy ジョブでしか要らないので、そちらの permissions が持つ。
# upload-pages-artifact は tar して upload-artifact を呼ぶだけで GITHUB_TOKEN を使わないので、build 側に Pages の権限は要らない。
permissions:
  contents: read

# Pages のデプロイは同時に 1 本しか走らないので、後続の push は待たせる。
# run の目的が判定でなく配信そのものなので、check.yml と違って途中で捨てない。
# 捨てると、その commit の内容が配信されないまま次へ進む。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # アプリは web/ の中（#39）。run: のステップだけを web/ で回す。
    # uses: のアクションには working-directory が効かないので、mise-action はリポジトリのルートに居たまま、ルートの mise.toml を読む。
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ランタイムは mise で入れる（toolchain.md）。版はルートの mise.toml が持つ。CI に書き下ろさない。
      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      # 公開先のパスの接頭辞（basePath と assetPrefix）はアプリ側の next.config.ts が持つ。
      # GitHub が Pages の設定画面から勧める Next.js 用の雛形は actions/configure-pages でこの接頭辞を注入するので、足すと出所が二つになる。

      # 回すのは build の一本だけに留める。
      # check.yml が Playwright のブラウザを入れているのは、配信物を実際にブラウザで開くスモークのためである。
      # next build はブラウザを使わないので、ここでは入れない。
      - run: pnpm build

      # このステップは uses: なので defaults の working-directory が効かない。
      # 静的出力は web/out に出るので、パスはリポジトリのルートから見た形で書く。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # deploy-pages が要求する最小の組み合わせ（pages: write と id-token: write）。
    # ジョブの permissions は workflow 側へ足すのでなく置き換えるので、checkout を持たないこのジョブに contents は書かない。
    permissions:
      pages: write
      id-token: write

    # 公開 URL は deploy-pages が出力するので、環境の側に書き下ろさない。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 配信された実物を一度開く（docs/adr/0036-post-deploy-reachability.md）。
      # 見るのは、ページが名指している参照へその URL から到達できるかの一点だけ。
      # canvas と実行時エラーは pnpm check の遮断版スモークが同じバイト列に対して見ているので、ここではブラウザを立てない。
      #
      # URL は deploy-pages の出力から取る。
      # ワークフローへ書き下ろすと、next.config.ts の basePath と出所が二つになる。
      # 出力を run: の中で展開せず env: で受けるのは、値がそのままシェルの構文として読まれる形を避けるため。
      - name: Verify the deployed site can reach what it references
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          # 配信の直後は CDN が古い版を返しうるので、ページの取得には再試行を掛ける。
          # 伝播の途中では 404 が返るため --retry-all-errors を足す（既定の --retry は 5xx と接続の失敗しか拾わない）。
          if ! html=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$PAGE_URL"); then
            echo "::error::$PAGE_URL を開けなかった"
            exit 1
          fi

          origin=$(printf '%s' "$PAGE_URL" | cut -d/ -f1-3)

          # 参照は HTML 自身から集める。
          # 接頭辞をここへ書くと検査とアプリで出所が二つになり、その食い違いを見るというこの検査の目的が消える。
          # `"/` で始まるものだけを拾うので、外部のオリジンへ出る参照は入らない。
          refs=$(printf '%s' "$html" | grep -oE '(src|href)="/[^"]*"' | sed 's/^[^"]*"//; s/"$//' | sort -u)

          # 取り出しが壊れると検査が黙って無検査になり、緑と区別が付かなくなるので、1 件も取れなければ赤にする。
          if [ -z "$refs" ]; then
            echo "::error::$PAGE_URL から参照を 1 件も取れなかった。取り出しの側が壊れている疑い。"
            exit 1
          fi

          # 4xx はこの検査が探しているものなので、参照の側には --retry-all-errors を足さない。
          # 足すと、見つけた事故の数だけ待ってから赤になる。
          unreachable=""
          while IFS= read -r ref; do
            if ! curl -fsS --retry 3 -o /dev/null "${origin}${ref}"; then
              unreachable="${unreachable}${ref} "
            fi
          done <<< "$refs"

          if [ -n "$unreachable" ]; then
            echo "::error::配信物へ到達できていない: $unreachable"
            exit 1
          fi

          echo "参照 $(printf '%s\n' "$refs" | wc -l | tr -d ' ') 件へ到達できた"
